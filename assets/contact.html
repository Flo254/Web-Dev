<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contact | Nairobi School</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
     <!-- Navigation Bar -->
    <nav class="navbar">
        <a href="#home">Home</a>
        <a href="#about">About Nairobi</a>
        <a href="#places">Places to Visit</a>
        <a href="#culture">Culture</a>
        <a href="#contact">Contact</a>
    </nav>

   <!-- Hero Section -->
      <section class="hero-contact">
        <h1> Contact.Us</h1>
        <p>Lorem ipsum dolar, sit amet consectetur adipisicing elit. Aut amet optio</p>
      </section>

      <section class="main-section">
        <div class="info">
            <img src="https://media.istockphoto.com/id/2239765546/photo/high-school-students-wearing-uniform-walking-to-school-entrance-carrying-bags.webp?a=1&b=1&s=612x612&w=0&k=20&c=3HlK8u6r4Ydf6CwiVYWV6UskXGkSAsahcsdSgw0O70s=" alt="school kids">
            <h2>Get in Touch</h2>
            <p>Email: info@nairobischool.edu</p>
            <p>Phone: +254 123 456 789</p>
            <p>Location: Nairobi, Kenya</p>
        </div>
        <div class="form">
            <form action="">
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="5" required></textarea>

                <button type="submit">Send Message</button>
            </form>
        </div>
      </section>
</body>
</html>
